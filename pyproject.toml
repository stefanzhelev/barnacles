[project]
name = "barnacles"
dynamic = ["version"]
description = "A static gallery for marimo notebooks: one YAML file, one command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Zhelev" }]
keywords = ["marimo", "notebooks", "static-site", "gallery", "wasm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["marimo>=0.20", "pyyaml>=6"]

[project.optional-dependencies]
thumbnails = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/octopyth/barnacles"
Issues = "https://github.com/octopyth/barnacles/issues"

[project.scripts]
barnacles = "barnacles.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.40"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/barnacles/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
