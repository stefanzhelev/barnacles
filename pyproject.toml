[project]
name = "barnacles"
dynamic = ["version"]
description = "A static HTML catalog for marimo apps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Zhelev" }]
keywords = ["marimo", "notebooks", "static-site", "catalog", "dashboards"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["marimo>=0.20", "playwright>=1.49", "pyyaml>=6"]

[project.optional-dependencies]
thumbnails = []  # kept so `pip install "barnacles[thumbnails]"` from 0.1.0 still works; now in the base install

[project.urls]
Homepage = "https://github.com/stefanzhelev/barnacles"
Issues = "https://github.com/stefanzhelev/barnacles/issues"

[project.scripts]
barnacles = "barnacles.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/barnacles/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
