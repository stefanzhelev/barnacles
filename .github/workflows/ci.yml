name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest
      # thumbnails on: the build must install Chromium by itself and produce the screenshots
      - run: uv run barnacles build demo
      - name: Check the thumbnails were made
        run: test "$(find demo/dist/thumbnails -name '*.png' | wc -l)" -eq 6
      - run: uv build
