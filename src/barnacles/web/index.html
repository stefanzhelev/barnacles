<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <link rel="icon" href="__FAVICON__">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- icons: <svg class="icon"><use href="#i-folder"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="folder-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--folder-top)"/>
        <stop offset="1" stop-color="var(--folder-bottom)"/>
      </linearGradient>
      <symbol id="i-folder" viewBox="0 0 64 52">
        <path d="M4 8a4 4 0 0 1 4-4h15.2a4 4 0 0 1 3.1 1.5L30 10h26a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z" fill="var(--folder-back)"/>
        <rect x="9" y="13" width="44" height="22" rx="2" fill="var(--paper)" opacity="0.9" transform="rotate(-3 31 24)"/>
        <rect x="11" y="16" width="44" height="22" rx="2" fill="var(--paper)"/>
        <path d="M2.2 22.6A4 4 0 0 1 6.2 18H58a4 4 0 0 1 4 4.5l-2.6 23.2A4 4 0 0 1 55.4 50H8.6a4 4 0 0 1-4-3.6Z" fill="url(#folder-front)"/>
        <path d="M6.2 18H58a4 4 0 0 1 3.4 1.9" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2" fill="none"/>
      </symbol>
      <symbol id="i-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/>
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 6 6 6-6 6"/>
      </symbol>
    </defs>
  </svg>

  <header>
    <button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <a class="brand" href="#/"><img src="__LOGO__" alt=""><span>__HEADER_TITLE__</span></a>
    <ol class="crumbs" aria-label="Breadcrumb"></ol>
    <a class="newtab" target="_blank" rel="noopener" hidden>Open in new tab ↗</a>
  </header>

  <nav id="menu" aria-label="Notebooks"></nav>
  <div class="backdrop"></div>

  <main>
    <section id="gallery">
      <h1></h1>
      <p class="lead"></p>
      <div class="grid"></div>
    </section>
    <iframe title="Notebook" hidden></iframe>
  </main>

  <script id="notebooks" type="application/json">__NOTEBOOKS__</script>
  <script src="app.js"></script>
</body>
</html>
