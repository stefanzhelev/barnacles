# Barnacles settings. Every key is optional; paths are relative to this file.
site:
  title: Notebooks               # browser tab title
  # header_title: My team        # text next to the logo (defaults to title)
  # logo: logo.svg               # defaults to the barnacles logo
  # favicon: favicon.svg         # defaults to the logo
  # theme: dark                  # default theme: dark, system or light

paths:
  notebooks: notebooks
  dist: dist

# exclude:                      # notebooks and folders to leave out of the catalog
#   - "notebooks/drafts/**"
#   - "**/_*.py"

defaults:
  notebook:
    mode: html                   # or html-wasm: run Python in the browser

items:                           # per-path overrides; notebooks show up without an entry
  "notebooks/nb1.py":
    description: A static dashboard rendered at build time.
  "notebooks/folder1":
    title: Folder 1
    description: Folders become sections of the catalog.
  "notebooks/folder1/subfolder1":
    title: Subfolder 1
    description: Folders can be nested.
  "notebooks/folder1/subfolder1/nb4.py":
    description: A notebook in a nested folder.
    # mode: html-wasm            # uncomment to run Python in the browser (live controls)
